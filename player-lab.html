<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JANTAR MANTAR RUN — Player Physics Lab</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1118;color:#f3f6fa;font-family:Inter,system-ui,Segoe UI,sans-serif}canvas{display:block;touch-action:none}#stage{position:fixed;inset:0}.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}.panel{background:#101923df;border:1px solid #ffffff24;border-radius:14px;padding:10px 12px;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0004}.brand{font-weight:900;letter-spacing:.09em;font-size:12px}.sub{color:#9caec0;font-size:11px;margin-top:4px}.stat{font-size:11px;color:#b9c8d6;line-height:1.7;text-align:right}.stat b{color:#fff}.bottom{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;gap:12px;pointer-events:none}.controls{pointer-events:auto;display:flex;gap:7px;flex-wrap:wrap;max-width:75%}.btn{border:1px solid #ffffff2a;background:#111d2aeb;color:white;padding:12px 14px;border-radius:12px;font-weight:800;font-size:11px;letter-spacing:.04em;touch-action:none;min-width:55px}.btn.active,.btn:active{background:#d97726;color:#10151a;border-color:#ffbe7b}.rightControls{pointer-events:auto;display:grid;grid-template-columns:repeat(2,auto);gap:7px}.hint{font-size:10px;color:#b5c4d3;max-width:210px;line-height:1.4}.tag{display:inline-block;border:1px solid #5aa58c77;color:#8ce3be;border-radius:99px;padding:3px 7px;font-size:9px;margin-top:7px}#toast{position:fixed;top:86px;left:50%;transform:translateX(-50%);background:#101923ed;border:1px solid #ffffff24;padding:9px 12px;border-radius:10px;font-size:11px;color:#dbe6ef;white-space:nowrap;pointer-events:none}#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff9;box-shadow:0 0 0 4px #fff2;pointer-events:none}@media(max-width:600px){.panel{padding:9px}.brand{font-size:10px}.sub,.stat{font-size:9px}.btn{padding:12px 10px;min-width:48px}.controls{max-width:78%;gap:5px}.hint{display:none}#toast{top:80px;font-size:10px}}
</style>
</head>
<body><div id="stage"></div><div class="top"><div class="panel"><div class="brand">JANTAR MANTAR RUN</div><div class="sub">PLAYER PHYSICS LAB · BUILD 01</div><span class="tag">ANIMATION + TERRAIN TEST</span></div><div class="panel stat"><div>STATE <b id="state">IDLE</b></div><div>SURFACE <b id="surface">FLAT GROUND</b></div><div>Y HEIGHT <b id="height">0.00 m</b></div></div></div><div id="toast">Move across the uneven terrain · Space / JUMP to hop</div><div id="cross"></div>
<div class="bottom"><div><div class="controls"><button class="btn" data-move="forward">▲</button><button class="btn" data-move="left">◀</button><button class="btn" data-move="back">▼</button><button class="btn" data-move="right">▶</button><button class="btn" id="sprint">SPRINT</button></div><div class="hint" style="margin:7px 0 0 2px">Keyboard: WASD / arrows · Shift sprint · Space jump · drag screen to orbit camera</div></div><div class="rightControls"><button class="btn" id="jump">JUMP</button><button class="btn" id="climb">CLIMB TEST</button><button class="btn" id="crouch">CROUCH</button><button class="btn" id="reset">RESET</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const stage=document.querySelector('#stage'),stateEl=document.querySelector('#state'),surfaceEl=document.querySelector('#surface'),heightEl=document.querySelector('#height'),toast=document.querySelector('#toast');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x93b6c7);scene.fog=new THREE.Fog(0x93b6c7,35,105);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdbeeff,0x5e5845,2.0));const sun=new THREE.DirectionalLight(0xffedcf,3.1);sun.position.set(-16,28,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const mat=(c,r=.9,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const mats={skin:mat(0x9e704f),hair:mat(0x201a18),shirt:mat(0x1c6775),shirt2:mat(0x124653),pants:mat(0x303947),shoe:mat(0x181d23),sole:mat(0xada99c),trim:mat(0xe1b45e),rock:mat(0x77766d),rock2:mat(0x575b58),grass:mat(0x52694a),concrete:mat(0x9a9a8d),asphalt:mat(0x363c42),white:mat(0xf0e6d2)};
function mesh(geo,material,parent,x=0,y=0,z=0){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(parent,material,x,y,z,sx,sy,sz){return mesh(new THREE.BoxGeometry(sx,sy,sz),material,parent,x,y,z)}
// A continuous rocky practice field with deliberately varied elevations.
const fieldGeo=new THREE.PlaneGeometry(120,120,100,100);fieldGeo.rotateX(-Math.PI/2);const p=fieldGeo.attributes.position;
function terrainH(x,z){return .12*Math.sin(x*.72)*Math.cos(z*.39)+.08*Math.sin(z*1.25+x*.3)+.05*Math.cos(x*1.5-z*.7)}
for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,terrainH(x,z))}fieldGeo.computeVertexNormals();const field=mesh(fieldGeo,mat(0x737b68),scene,0,-.04,0);field.receiveShadow=true;
// Rock scatter and terrain chunks; clear playable lane remains in the middle.
let seed=17;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
for(let i=0;i<190;i++){let x=(rnd()-.5)*42,z=(rnd()-.5)*52;if(Math.abs(x)<2.5&&z>-18&&z<17)continue;const size=.25+rnd()*1.05;const rock=mesh(new THREE.DodecahedronGeometry(size,0),rnd()>.5?mats.rock:mats.rock2,scene,x,terrainH(x,z)+size*.4,z);rock.scale.set(1+rnd(),.55+rnd()*.5,.8+rnd()*.6);rock.rotation.set(rnd(),rnd()*3,rnd());}
// stepped climb platform, a low ledge, and a ramp.
for(let i=0;i<5;i++){const h=.22+i*.24;const st=box(scene,mats.concrete,-5,h/2,-4-i*1.25,3,h,1.3);st.position.y=terrainH(-5,-4-i*1.25)+h/2;st.userData.surface='CONCRETE STEPS'}
const ledge=box(scene,mats.concrete,5,1.05,-9,4,2.1,3);ledge.position.y=terrainH(5,-9)+1.05;ledge.userData.surface='LEDGE / CLIMB';
const ramp=box(scene,mats.concrete,0,.45,-13,3.8,.5,7);ramp.rotation.x=-.12;ramp.position.y=terrainH(0,-13)+.3;ramp.userData.surface='SLOPED RAMP';
const road=box(scene,mats.asphalt,0,-.12,7,8,.12,34);road.position.y=terrainH(0,7)-.1;
for(let z=-8;z<24;z+=3.5)box(scene,mats.white,0,-.05,z,.09,.015,1.25).position.y=terrainH(0,z)+.01;
// low wall to test collision and a few markers.
const wall=box(scene,mats.rock2,9,1.0,-2,1.1,2,16);wall.position.y=terrainH(9,-2)+1;wall.userData.surface='WALL';
for(let i=0;i<7;i++){const pole=box(scene,mat(0x303c42),-9,1.4,-12+i*4,.12,2.8,.12);pole.position.y=terrainH(-9,-12+i*4)+1.4;box(scene,mats.trim,-9,2.6,-12+i*4,.35,.12,.35).position.y=terrainH(-9,-12+i*4)+2.6}
// Character rig built from articulated parts so the preview can test movement states before importing final skinned GLB.
const player=new THREE.Group();scene.add(player);
const hips=new THREE.Group();player.add(hips);
const torsoPivot=new THREE.Group();torsoPivot.position.y=1.05;hips.add(torsoPivot);
box(torsoPivot,mats.shirt,0,.32,0,.58,.72,.34);box(torsoPivot,mats.shirt2,0,.08,.19,.38,.08,.025);box(torsoPivot,mats.trim,0,.02,.18,.43,.045,.035);
const neck=mesh(new THREE.CylinderGeometry(.09,.11,.15,10),mats.skin,torsoPivot,0,.74,0);
const head=mesh(new THREE.SphereGeometry(.22,18,14),mats.skin,torsoPivot,0,.98,0);head.scale.set(.86,1.1,.9);
const hair=mesh(new THREE.SphereGeometry(.225,16,10,0,Math.PI*2,0,Math.PI*.62),mats.hair,torsoPivot,0,1.04,-.025);
box(torsoPivot,mats.hair,0,.92,.16,.29,.07,.08);
const eyeMat=mat(0x171819,.4);mesh(new THREE.SphereGeometry(.022,8,6),eyeMat,torsoPivot,-.075,.99,.187);mesh(new THREE.SphereGeometry(.022,8,6),eyeMat,torsoPivot,.075,.99,.187);
function limb(parent,material,len,r1,r2){const pivot=new THREE.Group();parent.add(pivot);const g=mesh(new THREE.CapsuleGeometry(r1,len*.42,4,8),material,pivot,0,-len*.42,0);g.scale.y=1.12;return pivot}
const arms=[],legs=[];
for(const side of [-1,1]){const arm=new THREE.Group();arm.position.set(side*.38,.59,0);torsoPivot.add(arm);mesh(new THREE.CapsuleGeometry(.105,.39,4,8),mats.shirt,arm,0,-.25,0);const fore=new THREE.Group();fore.position.y=-.46;arm.add(fore);mesh(new THREE.CapsuleGeometry(.075,.34,4,8),mats.skin,fore,0,-.2,0);mesh(new THREE.SphereGeometry(.08,10,8),mats.skin,fore,0,-.4,.01);arms.push({upper:arm,fore,side});
const leg=new THREE.Group();leg.position.set(side*.17,.76,0);hips.add(leg);mesh(new THREE.CapsuleGeometry(.13,.39,4,8),mats.pants,leg,0,-.27,0);const shin=new THREE.Group();shin.position.y=-.51;leg.add(shin);mesh(new THREE.CapsuleGeometry(.095,.36,4,8),mats.pants,shin,0,-.2,0);box(shin,mats.shoe,0,-.43,.085,.22,.14,.38);box(shin,mats.sole,0,-.5,.085,.23,.045,.39);legs.push({upper:leg,shin,side});}
player.position.set(0,terrainH(0,18),18);
// Lightweight physics: vertical velocity/gravity, terrain ground height, ledge step-up and wall/rock bounds.
const keys={},held={forward:false,back:false,left:false,right:false};let yaw=0,pitch=.12,vy=0,onGround=true,sprinting=false,crouched=false,climbing=false,airborne=false,animTime=0,camDrag=null;const radius=.34;
function obstacleAt(x,z){if(Math.abs(x-9)<.85&&z>-10&&z<6)return {type:'WALL',height:2};if(Math.abs(x-5)<2.15&&Math.abs(z+9)<1.8)return {type:'LEDGE',height:2.1};return null}
function groundAt(x,z){let h=terrainH(x,z);if(x>-6.6&&x<-3.4&&z<-3&&z>-11){const n=Math.max(0,Math.min(4,Math.floor((-z-3)/1.25)));h+=.22+n*.24}if(Math.abs(x)<1.9&&z<-9.5&&z>-17){h+=Math.max(0,Math.min(.8,(-z-10)*.12))}return h}
function jump(){if(onGround&&!climbing){vy=6.2;onGround=false;airborne=true;crouched=false;stateEl.textContent='JUMP';}}
function doClimb(){if(climbing)return;const obs=obstacleAt(player.position.x-Math.sin(yaw)*.8,player.position.z-Math.cos(yaw)*.8);if(obs&&obs.height<2.5){climbing=true;onGround=false;vy=0;toast.textContent='Climb test: scripted ledge traversal';setTimeout(()=>{player.position.y=groundAt(player.position.x,player.position.z)+obs.height;player.position.x-=Math.sin(yaw)*.8;player.position.z-=Math.cos(yaw)*.8;climbing=false;onGround=true;toast.textContent='Climb complete · check landing and movement'},650)}else{toast.textContent='Move close to the marked ledge, then tap CLIMB TEST'} }
document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held[k]=true;b.classList.add('active')});const off=()=>{held[k]=false;b.classList.remove('active')};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,off))});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();jump()}if(e.key==='Shift')sprinting=true;if(e.key.toLowerCase()==='c')crouched=!crouched});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')sprinting=false});
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});document.querySelector('#climb').addEventListener('click',doClimb);document.querySelector('#sprint').addEventListener('click',()=>{sprinting=!sprinting;document.querySelector('#sprint').classList.toggle('active',sprinting)});document.querySelector('#crouch').addEventListener('click',()=>{crouched=!crouched;document.querySelector('#crouch').classList.toggle('active',crouched)});document.querySelector('#reset').addEventListener('click',()=>{player.position.set(0,groundAt(0,18),18);vy=0;onGround=true;yaw=0;pitch=.12;sprinting=false;crouched=false;climbing=false;toast.textContent='Reset complete · test the uneven surfaces'});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;camDrag={x:e.clientX,y:e.clientY,id:e.pointerId};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!camDrag)return;const dx=e.clientX-camDrag.x,dy=e.clientY-camDrag.y;camDrag.x=e.clientX;camDrag.y=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.25,.55)});stage.addEventListener('pointerup',()=>camDrag=null);stage.addEventListener('pointercancel',()=>camDrag=null);
let last=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.04);last=now;const f=(held.forward||keys.w||keys.arrowup?1:0)-(held.back||keys.s||keys.arrowdown?1:0),s=(held.right||keys.d||keys.arrowright?1:0)-(held.left||keys.a||keys.arrowleft?1:0);const moving=Math.abs(f)+Math.abs(s)>.05;const speed=(sprinting?7.4:crouched?1.45:4.1)*dt;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));let dx=(forward.x*f+right.x*s)*speed,dz=(forward.z*f+right.z*s)*speed;const nx=player.position.x+dx,nz=player.position.z+dz;const obs=obstacleAt(nx,nz);if(!obs){player.position.x=THREE.MathUtils.clamp(nx,-22,22);player.position.z=THREE.MathUtils.clamp(nz,-27,28)}else{surfaceEl.textContent=obs.type+' BLOCKED'}
if(moving&&!climbing){player.rotation.y=Math.atan2(-dx,-dz);animTime+=dt*(sprinting?13:crouched?5:8);stateEl.textContent=crouched?'CROUCH WALK':sprinting?'SPRINT':'WALK'}else if(!climbing&&!airborne){stateEl.textContent=crouched?'CROUCH':'IDLE'}
if(climbing){stateEl.textContent='CLIMB';torsoPivot.rotation.x=-.22;arms.forEach(a=>a.upper.rotation.x=Math.sin(now*.012)*.8);legs.forEach(l=>l.upper.rotation.x=Math.sin(now*.012+Math.PI)*.5)}else{
const amp=moving?(sprinting?.82:crouched?.28:.52):0;legs.forEach((l,i)=>{const phase=animTime+(i?Math.PI:0);l.upper.rotation.x=Math.sin(phase)*amp+(airborne?-.25:0);l.shin.rotation.x=Math.max(0,Math.sin(phase+1))*amp*.75+(airborne?.55:0)});arms.forEach((a,i)=>{const phase=animTime+(i?Math.PI:0);a.upper.rotation.x=-Math.sin(phase)*amp*.8+(airborne?-.85:0);a.upper.rotation.z=a.side*(crouched?.2:.04);a.fore.rotation.x=airborne?-.3:0});torsoPivot.rotation.x=airborne?-.15:moving&&sprinting?.08:0;hips.position.y=crouched?-.28:0;
}
if(!onGround&&!climbing){vy-=17.5*dt;player.position.y+=vy*dt;const g=groundAt(player.position.x,player.position.z);if(player.position.y<=g){player.position.y=g;vy=0;onGround=true;airborne=false;stateEl.textContent='LAND';setTimeout(()=>{if(stateEl.textContent==='LAND')stateEl.textContent='IDLE'},350)}}else if(onGround&&!climbing){const g=groundAt(player.position.x,player.position.z);player.position.y=THREE.MathUtils.lerp(player.position.y,g,Math.min(1,dt*16))}
const target=new THREE.Vector3(player.position.x,player.position.y+1.2,player.position.z);const dist=6.6;const desired=new THREE.Vector3(target.x+Math.sin(yaw)*dist,target.y+1.7+pitch*4,target.z+Math.cos(yaw)*dist);camera.position.lerp(desired,1-Math.exp(-dt*6));camera.lookAt(target.x,target.y+.12,target.z);surfaceEl.textContent=obstacleAt(player.position.x,player.position.z)?.type||((Math.abs(groundAt(player.position.x,player.position.z)-terrainH(player.position.x,player.position.z))>.1)?'STEPS / SLOPE':'ROCKY TERRAIN');heightEl.textContent=player.position.y.toFixed(2)+' m';renderer.render(scene,camera)}
requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
